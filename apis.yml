name: Aktis Oncology
description: >-
  Aktis Oncology is a clinical-stage biotechnology company developing next-generation
  precision radiopharmaceuticals for the treatment of cancer. The company has built a
  proprietary miniprotein radioconjugate platform that pairs tumor-targeting miniproteins
  with targeted alpha-particle emitters, aiming to reach solid-tumor types that have been
  difficult to address with existing radiopharmaceutical therapies. Aktis focuses on
  patient populations with significant unmet medical need, advancing a pipeline of targeted
  alpha-based therapeutic candidates. The company operates from Boston, Massachusetts, with
  an additional site in Research Triangle Park, North Carolina. Aktis Oncology was surfaced
  as an a16z portfolio company and added to the API Evangelist network; it is a biotechnology
  company with no public developer API surface.
